blueprint:
  name: Enviar Mensagem Via Alexa
  description: >-
    Versão: 1.2.0

    Envia uma mensagem por uma ou mais caixas Echo selecionadas, ajustando
    temporariamente o volume e restaurando, ao final, o volume anterior de
    cada dispositivo através do serviço nativo do Alexa Media Player.

    FUNCIONAMENTO:

    - Permite selecionar uma ou várias Alexas ao mesmo tempo.
    - Ajusta todas temporariamente para o volume definido para o anúncio.
    - Envia a mensagem como anúncio pelo Alexa Media Player.
    - Aguarda a conclusão estimada do anúncio.
    - Restaura individualmente cada Alexa usando alexa_media.restore_volume.

  domain: script
  source_url: https://github.com/msoaresp/home-assistant-blueprints/blob/main/script/enviar_mensagem_via_alexa.yaml

  input: {}

mode: queued
max: 10

fields:
  mensagem:
    name: Mensagem
    description: Texto que será anunciado.
    required: true
    selector:
      text:
        multiline: true

  onde_anunciar:
    name: Onde anunciar
    description: Selecione uma ou mais caixas Echo.
    required: true
    default: []
    selector:
      entity:
        filter:
          - integration: alexa_media
            domain: media_player
        multiple: true

  volume:
    name: Volume do anúncio
    description: Volume temporário utilizado durante o anúncio.
    required: true
    default: 0.9
    selector:
      number:
        min: 0.1
        max: 1
        step: 0.1
        mode: slider

variables:
  blueprint_version: "1.2.0"
  alexas: "{{ onde_anunciar | default([]) }}"

sequence:
  - condition: template
    value_template: >-
      {{
        mensagem | default('') | trim | length > 0
        and alexas | count > 0
      }}

  - action: media_player.volume_set
    continue_on_error: true
    target:
      entity_id: "{{ alexas }}"
    data:
      volume_level: "{{ volume | float(0.9) }}"

  - delay:
      seconds: 2

  - action: notify.alexa_media
    data:
      message: "{{ mensagem }}"
      target: "{{ alexas }}"
      data:
        type: announce

  - delay:
      seconds: >-
        {{
          [
            12,
            ((mensagem | trim | length / 10) | round(0, 'ceil') | int) + 6
          ] | max
        }}

  - repeat:
      for_each: "{{ alexas }}"
      sequence:
        - action: alexa_media.restore_volume
          continue_on_error: true
          data:
            entity_id: "{{ repeat.item }}"

        - delay:
            seconds: 1

icon: mdi:bullhorn

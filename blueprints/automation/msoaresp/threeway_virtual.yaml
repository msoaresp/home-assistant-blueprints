blueprint:
  name: ThreeWay Virtual
  description: >-
    Sincroniza o estado entre múltiplas luzes e switches, criando um
    interruptor paralelo virtual.

    No uso normal, a última entidade alterada define imediatamente o estado
    das demais.

    Proteções e recuperação:

    - Reage somente às transições OFF → ON e ON → OFF.
    - Não envia comando para a entidade que originou a mudança.
    - Só envia comandos para entidades que realmente precisam mudar.
    - Ignora entidades em estado unavailable ou unknown.
    - Mantém uma pequena janela de bloqueio após cada sincronização para
      reduzir realimentações e loops.
    - Após reinício do Home Assistant, aguarda 10 segundos e reconcilia o grupo.
    - Quando uma entidade retorna de unavailable ou unknown, reconcilia o grupo.
    - Na reconciliação, a maioria dos estados válidos vence.
    - Em caso de empate, prevalece OFF por segurança.
    - Utiliza mode single para impedir execuções simultâneas.

  domain: automation

  input:
    entrada_switchs:
      name: Pontos de Iluminação
      description: >-
        Selecione as luzes e/ou switches que deverão funcionar como
        interruptores paralelos.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

    tempo_bloqueio:
      name: Proteção contra realimentação
      description: >-
        Tempo durante o qual novas alterações serão ignoradas após uma
        sincronização normal. O padrão de 3 segundos ajuda a absorver
        atualizações atrasadas de dispositivos Zigbee e Wi-Fi.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          unit_of_measurement: s
          mode: slider

triggers:
  - trigger: state
    entity_id: !input entrada_switchs
    from: "off"
    to: "on"
    id: ligar

  - trigger: state
    entity_id: !input entrada_switchs
    from: "on"
    to: "off"
    id: desligar

  - trigger: state
    entity_id: !input entrada_switchs
    from: "unavailable"
    to: "on"
    id: reconciliar

  - trigger: state
    entity_id: !input entrada_switchs
    from: "unavailable"
    to: "off"
    id: reconciliar

  - trigger: state
    entity_id: !input entrada_switchs
    from: "unknown"
    to: "on"
    id: reconciliar

  - trigger: state
    entity_id: !input entrada_switchs
    from: "unknown"
    to: "off"
    id: reconciliar

  - trigger: homeassistant
    event: start
    id: inicializacao

variables:
  pontos: !input entrada_switchs

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - ligar
              - desligar
        sequence:
          - variables:
              estado_desejado: >-
                {% if trigger.id == 'ligar' %}
                  on
                {% else %}
                  off
                {% endif %}

              alvos: >-
                {{
                  expand(pontos)
                  | selectattr('state', 'in', ['on', 'off'])
                  | rejectattr('state', 'eq', estado_desejado | trim)
                  | rejectattr('entity_id', 'eq', trigger.entity_id)
                  | map(attribute='entity_id')
                  | list
                }}

          - if:
              - condition: template
                value_template: "{{ alvos | count > 0 }}"
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ estado_desejado | trim == 'on' }}"
                    sequence:
                      - action: homeassistant.turn_on
                        target:
                          entity_id: "{{ alvos }}"

                  - conditions:
                      - condition: template
                        value_template: "{{ estado_desejado | trim == 'off' }}"
                    sequence:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: "{{ alvos }}"

          - delay:
              seconds: !input tempo_bloqueio

      - conditions:
          - condition: trigger
            id: inicializacao
        sequence:
          - delay: "00:00:10"

          - variables:
              quantidade_on: >-
                {{
                  expand(pontos)
                  | selectattr('state', 'eq', 'on')
                  | list
                  | count
                }}

              quantidade_off: >-
                {{
                  expand(pontos)
                  | selectattr('state', 'eq', 'off')
                  | list
                  | count
                }}

              estado_reconciliado: >-
                {% if quantidade_on | int > quantidade_off | int %}
                  on
                {% else %}
                  off
                {% endif %}

              alvos_reconciliacao: >-
                {{
                  expand(pontos)
                  | selectattr('state', 'in', ['on', 'off'])
                  | rejectattr('state', 'eq', estado_reconciliado | trim)
                  | map(attribute='entity_id')
                  | list
                }}

          - condition: template
            value_template: >-
              {{ (quantidade_on | int + quantidade_off | int) > 0 }}

          - if:
              - condition: template
                value_template: "{{ alvos_reconciliacao | count > 0 }}"
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ estado_reconciliado | trim == 'on' }}"
                    sequence:
                      - action: homeassistant.turn_on
                        target:
                          entity_id: "{{ alvos_reconciliacao }}"

                  - conditions:
                      - condition: template
                        value_template: "{{ estado_reconciliado | trim == 'off' }}"
                    sequence:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: "{{ alvos_reconciliacao }}"

      - conditions:
          - condition: trigger
            id: reconciliar
        sequence:
          - delay: "00:00:02"

          - variables:
              quantidade_on: >-
                {{
                  expand(pontos)
                  | selectattr('state', 'eq', 'on')
                  | list
                  | count
                }}

              quantidade_off: >-
                {{
                  expand(pontos)
                  | selectattr('state', 'eq', 'off')
                  | list
                  | count
                }}

              estado_reconciliado: >-
                {% if quantidade_on | int > quantidade_off | int %}
                  on
                {% else %}
                  off
                {% endif %}

              alvos_reconciliacao: >-
                {{
                  expand(pontos)
                  | selectattr('state', 'in', ['on', 'off'])
                  | rejectattr('state', 'eq', estado_reconciliado | trim)
                  | map(attribute='entity_id')
                  | list
                }}

          - condition: template
            value_template: >-
              {{ (quantidade_on | int + quantidade_off | int) > 0 }}

          - if:
              - condition: template
                value_template: "{{ alvos_reconciliacao | count > 0 }}"
            then:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ estado_reconciliado | trim == 'on' }}"
                    sequence:
                      - action: homeassistant.turn_on
                        target:
                          entity_id: "{{ alvos_reconciliacao }}"

                  - conditions:
                      - condition: template
                        value_template: "{{ estado_reconciliado | trim == 'off' }}"
                    sequence:
                      - action: homeassistant.turn_off
                        target:
                          entity_id: "{{ alvos_reconciliacao }}"

mode: single
max_exceeded: silent
